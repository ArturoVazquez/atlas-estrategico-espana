name: Validar el contrato de datos

# Dos disparos distintos, por dos motivos distintos:
#   - En cada PR que toque datos, esquemas o el pipeline: es el momento en que
#     un dato mal sostenido intenta entrar, y el único en que pararlo es barato.
#   - En cada push a main: por si algo entró sin PR. Un contrato que solo se
#     comprueba por la puerta principal no es un contrato.
on:
  pull_request:
    paths:
      - 'datos/**'
      - 'pipeline/**'
      - '.github/workflows/validar.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --quiet -r pipeline/requirements.txt

      # Primero el validador se prueba a sí mismo. El orden no es capricho: un
      # validador roto pasa cualquier dato en verde, y entonces el paso
      # siguiente daría una garantía falsa — que es peor que no dar ninguna.
      - name: Probar el validador (las reglas de §6.4 y las comprobaciones de §7)
        run: python pipeline/pruebas/correr.py

      - name: Validar el manifiesto y las capas publicadas
        run: python pipeline/validar.py
